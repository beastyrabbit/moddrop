name: Release container images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: arc-moddrop
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: moddrop-frontend
            dockerfile: Dockerfile
            sourcemap_upload_required: '1'
          - image: moddrop-stream-canvas
            dockerfile: backend/stream-canvas/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Set application release
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=moddrop@${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=moddrop@$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.arc-runners.svc.cluster.local:1234
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_RELEASE=${{ steps.release.outputs.value }}
            SOURCEMAP_UPLOAD_REQUIRED=${{ matrix.sourcemap_upload_required }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CANVAS_API_URL=/canvas-api
            NEXT_PUBLIC_TLDRAW_LICENSE_KEY=${{ secrets.NEXT_PUBLIC_TLDRAW_LICENSE_KEY }}
          secrets: |
            glitchtip_auth_token=${{ secrets.GLITCHTIP_AUTH_TOKEN }}
