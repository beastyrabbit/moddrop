name: Verify
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# Cancel runs superseded by a newer push to the same PR; push, tag and manual runs keep separate groups.
concurrency:
  group: ${{ github.workflow }}-verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: arc-moddrop
    container:
      image: node:26.5.0-bookworm
      options: --user 0
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: canvas_test
          POSTGRES_USER: canvas_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U canvas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CANVAS_TEST_DATABASE_URL: postgresql://canvas_test@postgres:5432/canvas_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/verify.sh
  proof:
    needs: verify
    runs-on: arc-moddrop
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record verified checkout
        id: proof
        run: |
          commit=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          [[ "$commit" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$tree" =~ ^[0-9a-fA-F]{40}$ ]]
          printf '{"commit":"%s","tree":"%s"}\n' "$commit" "$tree" > verify-proof.json
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: verify-proof-${{ steps.proof.outputs.tree }}
          path: verify-proof.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14
