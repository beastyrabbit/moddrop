name: Build and Push Container Images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_frontend:
        description: "Build frontend image"
        type: boolean
        default: true
      build_stream_canvas:
        description: "Build stream-canvas image"
        type: boolean
        default: true

enable-openid-connect: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: git.heerlab.com
  OWNER: ${{ github.repository_owner }}
  INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
  INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
  INFISICAL_ENV: ${{ vars.INFISICAL_ENV }}
  INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}

jobs:
  verify:
    # Legacy Docker-backed Forgejo runner. See the backend delivery runbook.
    runs-on: personal
    container:
      image: node:26.5.0-bookworm
      options: --user 0
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: canvas_test
          POSTGRES_USER: canvas_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U canvas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CANVAS_TEST_DATABASE_URL: postgresql://canvas_test@postgres:5432/canvas_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/verify.sh

  changes:
    runs-on: personal
    if: github.ref == 'refs/heads/main'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      stream_canvas: ${{ steps.filter.outputs.stream_canvas }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base="$BEFORE_SHA"
          head="$HEAD_SHA"
          if [ -z "$base" ] || [ "$base" = "null" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          git diff --name-only "$base" "$head" | bash scripts/delivery-changes.sh >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: [verify, changes]
    if: |
      always() && needs.verify.result == 'success' && github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       needs.changes.outputs.frontend == 'true' ||
       github.event.inputs.build_frontend == 'true')
    runs-on: personal
    steps:
      - uses: actions/checkout@v7

      - name: Set application release
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=moddrop@${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=moddrop@$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Docker CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates docker.io
          docker --version

      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.forgejo-runners.svc.cluster.local:1234

      - uses: https://git.heerlab.com/beasty/forgejo-ci/actions/registry-login@main

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/moddrop-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Fetch frontend CI secrets from Infisical
        id: ci-secrets
        env:
          REQUIRED_KEYS: NEXT_PUBLIC_TLDRAW_LICENSE_KEY
        run: |
          set -euo pipefail
          : "${INFISICAL_API_URL:?Missing INFISICAL_API_URL Forgejo variable}"
          : "${INFISICAL_PROJECT_ID:?Missing INFISICAL_PROJECT_ID Forgejo variable}"
          : "${INFISICAL_ENV:?Missing INFISICAL_ENV Forgejo variable}"
          : "${INFISICAL_MACHINE_IDENTITY_ID:?Missing INFISICAL_MACHINE_IDENTITY_ID Forgejo variable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Missing Forgejo OIDC request token}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Missing Forgejo OIDC request URL}"

          export npm_config_prefix="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_config_prefix"
          npm install --global @infisical/cli@0.43.113
          export PATH="$npm_config_prefix/bin:$PATH"

          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://git.heerlab.com/beasty")"
          forgejo_jwt="$(node -e 'const fs = require("fs"); const body = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(body.value || "");' <<< "$oidc_response")"
          : "${forgejo_jwt:?Forgejo OIDC response did not include a token}"

          infisical_token="$(infisical login \
            --method oidc-auth \
            --machine-identity-id "$INFISICAL_MACHINE_IDENTITY_ID" \
            --jwt "$forgejo_jwt" \
            --domain "$INFISICAL_API_URL" \
            --plain \
            --silent)"
          : "${infisical_token:?Infisical OIDC login returned an empty token}"
          echo "::add-mask::$infisical_token"

          for key in $REQUIRED_KEYS; do
            value="$(infisical secrets get "$key" \
              --domain "$INFISICAL_API_URL" \
              --token "$infisical_token" \
              --projectId "$INFISICAL_PROJECT_ID" \
              --env "$INFISICAL_ENV" \
              --path /ci \
              --plain \
              --silent)"
            : "${value:?Missing $key in Infisical prod /ci}"
            echo "::add-mask::$value"
            {
              echo "$key<<EOF"
              printf '%s\n' "$value"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_RELEASE=${{ steps.release.outputs.value }}
            NEXT_PUBLIC_TLDRAW_LICENSE_KEY=${{ steps.ci-secrets.outputs.NEXT_PUBLIC_TLDRAW_LICENSE_KEY }}

  build-stream-canvas:
    needs: [verify, changes]
    if: |
      always() && needs.verify.result == 'success' && github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       needs.changes.outputs.stream_canvas == 'true' ||
       github.event.inputs.build_stream_canvas == 'true')
    runs-on: personal
    steps:
      - uses: actions/checkout@v7

      - name: Set application release
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=moddrop@${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=moddrop@$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Docker CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates docker.io
          docker --version

      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.forgejo-runners.svc.cluster.local:1234

      - uses: https://git.heerlab.com/beasty/forgejo-ci/actions/registry-login@main

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/moddrop-stream-canvas
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/stream-canvas/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_RELEASE=${{ steps.release.outputs.value }}
