name: Build and Push Container Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_frontend:
        description: "Build frontend image"
        type: boolean
        default: true
      build_stream_canvas:
        description: "Build stream-canvas image"
        type: boolean
        default: true
      deploy_convex:
        description: "Deploy Convex backend (main branch only)"
        type: boolean
        default: false

enable-openid-connect: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: git.heerlab.com
  OWNER: ${{ github.repository_owner }}
  INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
  INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
  INFISICAL_ENV: ${{ vars.INFISICAL_ENV }}
  INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}

jobs:
  changes:
    runs-on: personal
    if: github.ref == 'refs/heads/main'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      convex: ${{ steps.filter.outputs.convex }}
      stream_canvas: ${{ steps.filter.outputs.stream_canvas }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base="$BEFORE_SHA"
          head="$HEAD_SHA"
          if [ -z "$base" ] || [ "$base" = "null" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          changed="$(git diff --name-only "$base" "$head" || git diff --name-only HEAD~1 HEAD || true)"

          has_changed() {
            printf '%s\n' "$changed" | grep -Eq "$1"
          }

          set_output() {
            name="$1"
            pattern="$2"
            if has_changed "$pattern"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          set_output frontend '^(app|components|lib|public)/|^(\.dockerignore|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|next\.config\.mjs|postcss\.config\.mjs|tailwind\.config\.ts|tsconfig\.json|biome\.json|components\.json|Dockerfile|docker-entrypoint\.sh)$'
          set_output convex '^convex/|^convex\.json$'
          set_output stream_canvas '^backend/stream-canvas/|^\.dockerignore$'

  tag-convex-changes:
    runs-on: personal
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      convex: ${{ steps.diff.outputs.convex }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          previous_tag=$(
            git tag --sort=-version:refname \
              | grep -Fxv "$CURRENT_TAG" \
              | head -n 1
          )

          if [ -z "$previous_tag" ]; then
            echo "No previous release tag found; deploying Convex by default."
            echo "convex=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$previous_tag..$CURRENT_SHA" -- convex; then
            echo "convex=false" >> "$GITHUB_OUTPUT"
          else
            echo "convex=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-convex:
    needs: [changes, tag-convex-changes]
    # Re-enable after CONVEX_DEPLOY_KEY is rotated/imported into Infisical.
    if: ${{ false }}
    runs-on: personal
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch Convex deploy secrets from Infisical
        id: ci-secrets
        env:
          REQUIRED_KEYS: CONVEX_DEPLOY_KEY CONVEX_DEPLOYMENT CLERK_JWT_ISSUER_DOMAIN
        run: |
          set -euo pipefail
          : "${INFISICAL_API_URL:?Missing INFISICAL_API_URL Forgejo variable}"
          : "${INFISICAL_PROJECT_ID:?Missing INFISICAL_PROJECT_ID Forgejo variable}"
          : "${INFISICAL_ENV:?Missing INFISICAL_ENV Forgejo variable}"
          : "${INFISICAL_MACHINE_IDENTITY_ID:?Missing INFISICAL_MACHINE_IDENTITY_ID Forgejo variable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Missing Forgejo OIDC request token}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Missing Forgejo OIDC request URL}"

          export npm_config_prefix="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_config_prefix"
          npm install --global @infisical/cli@0.43.91
          export PATH="$npm_config_prefix/bin:$PATH"

          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://git.heerlab.com/beasty")"
          forgejo_jwt="$(node -e 'const fs = require("fs"); const body = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(body.value || "");' <<< "$oidc_response")"
          : "${forgejo_jwt:?Forgejo OIDC response did not include a token}"

          infisical_token="$(infisical login \
            --method oidc-auth \
            --machine-identity-id "$INFISICAL_MACHINE_IDENTITY_ID" \
            --jwt "$forgejo_jwt" \
            --domain "$INFISICAL_API_URL" \
            --plain \
            --silent)"
          : "${infisical_token:?Infisical OIDC login returned an empty token}"
          echo "::add-mask::$infisical_token"

          for key in $REQUIRED_KEYS; do
            value="$(infisical secrets get "$key" \
              --domain "$INFISICAL_API_URL" \
              --token "$infisical_token" \
              --projectId "$INFISICAL_PROJECT_ID" \
              --env "$INFISICAL_ENV" \
              --path /ci \
              --plain \
              --silent)"
            : "${value:?Missing $key in Infisical prod /ci}"
            echo "::add-mask::$value"
            {
              echo "$key<<EOF"
              printf '%s\n' "$value"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - run: pnpm exec convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ steps.ci-secrets.outputs.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ steps.ci-secrets.outputs.CONVEX_DEPLOYMENT }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ steps.ci-secrets.outputs.CLERK_JWT_ISSUER_DOMAIN }}

  build-frontend:
    needs: changes
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       needs.changes.outputs.frontend == 'true' ||
       github.event.inputs.build_frontend == 'true')
    runs-on: personal
    steps:
      - uses: actions/checkout@v6

      - name: Install Docker CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates docker.io
          docker --version

      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.forgejo-runners.svc.cluster.local:1234

      - uses: https://git.heerlab.com/beasty/forgejo-ci/actions/registry-login@main

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/moddrop-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Fetch frontend CI secrets from Infisical
        id: ci-secrets
        env:
          REQUIRED_KEYS: CONVEX_DEPLOYMENT NEXT_PUBLIC_TLDRAW_LICENSE_KEY
        run: |
          set -euo pipefail
          : "${INFISICAL_API_URL:?Missing INFISICAL_API_URL Forgejo variable}"
          : "${INFISICAL_PROJECT_ID:?Missing INFISICAL_PROJECT_ID Forgejo variable}"
          : "${INFISICAL_ENV:?Missing INFISICAL_ENV Forgejo variable}"
          : "${INFISICAL_MACHINE_IDENTITY_ID:?Missing INFISICAL_MACHINE_IDENTITY_ID Forgejo variable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Missing Forgejo OIDC request token}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Missing Forgejo OIDC request URL}"

          export npm_config_prefix="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_config_prefix"
          npm install --global @infisical/cli@0.43.91
          export PATH="$npm_config_prefix/bin:$PATH"

          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://git.heerlab.com/beasty")"
          forgejo_jwt="$(node -e 'const fs = require("fs"); const body = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(body.value || "");' <<< "$oidc_response")"
          : "${forgejo_jwt:?Forgejo OIDC response did not include a token}"

          infisical_token="$(infisical login \
            --method oidc-auth \
            --machine-identity-id "$INFISICAL_MACHINE_IDENTITY_ID" \
            --jwt "$forgejo_jwt" \
            --domain "$INFISICAL_API_URL" \
            --plain \
            --silent)"
          : "${infisical_token:?Infisical OIDC login returned an empty token}"
          echo "::add-mask::$infisical_token"

          for key in $REQUIRED_KEYS; do
            value="$(infisical secrets get "$key" \
              --domain "$INFISICAL_API_URL" \
              --token "$infisical_token" \
              --projectId "$INFISICAL_PROJECT_ID" \
              --env "$INFISICAL_ENV" \
              --path /ci \
              --plain \
              --silent)"
            : "${value:?Missing $key in Infisical prod /ci}"
            echo "::add-mask::$value"
            {
              echo "$key<<EOF"
              printf '%s\n' "$value"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CONVEX_DEPLOYMENT=${{ steps.ci-secrets.outputs.CONVEX_DEPLOYMENT }}
            NEXT_PUBLIC_TLDRAW_LICENSE_KEY=${{ steps.ci-secrets.outputs.NEXT_PUBLIC_TLDRAW_LICENSE_KEY }}

  build-stream-canvas:
    needs: changes
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       needs.changes.outputs.stream_canvas == 'true' ||
       github.event.inputs.build_stream_canvas == 'true')
    runs-on: personal
    steps:
      - uses: actions/checkout@v6

      - name: Install Docker CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates docker.io
          docker --version

      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.forgejo-runners.svc.cluster.local:1234

      - uses: https://git.heerlab.com/beasty/forgejo-ci/actions/registry-login@main

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/moddrop-stream-canvas
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/stream-canvas/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
